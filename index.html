<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת אבטחה, צ'אט שיתופי ובינה מלאכותית</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Heebo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-xl bg-slate-800 rounded-2xl shadow-2xl overflow-hidden border border-slate-700">
        
        <div id="step1-container" class="p-6 space-y-4">
            <div class="flex items-center space-x-2 space-x-reverse text-blue-400 font-semibold mb-2">
                <span class="bg-blue-500/20 w-8 h-8 rounded-full flex items-center justify-center text-sm">1</span>
                <span>הזן סיסמה ראשונה</span>
            </div>
            <div>
                <input type="password" id="pass1" placeholder="הקלד סיסמה ראשונה..." 
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-white placeholder-slate-500 transition">
            </div>
            <button onclick="verifyStep1()" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-xl transition duration-200 shadow-lg shadow-blue-600/30 cursor-pointer">
                המשך לשלב הבא <i class="fa-solid fa-arrow-left mr-2"></i>
            </button>
        </div>

        <div id="step2-container" class="p-6 space-y-4 hidden">
            <div class="flex items-center space-x-2 space-x-reverse text-indigo-400 font-semibold mb-2">
                <span class="bg-indigo-500/20 w-8 h-8 rounded-full flex items-center justify-center text-sm">2</span>
                <span>הזן סיסמה שנייה</span>
            </div>
            <div>
                <input type="password" id="pass2" placeholder="הקלד סיסמה שנייה..." 
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white placeholder-slate-500 transition">
            </div>
            <button onclick="verifyStep2()" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30 cursor-pointer">
                כניסה למערכת <i class="fa-solid fa-lock-open mr-2"></i>
            </button>
            <button onclick="resetAuth()" class="w-full text-slate-400 text-sm hover:text-white py-1 cursor-pointer">
                חזור להתחלה
            </button>
        </div>

        <div id="main-content" class="p-6 space-y-6 hidden">
            <div class="bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-4 text-center">
                <i class="fa-solid fa-circle-check text-emerald-400 text-3xl mb-1"></i>
                <h2 class="text-lg font-bold text-emerald-300">הזדהות עברה בהצלחה!</h2>
                <p class="text-xs text-slate-300 mt-1" id="user-info-display">מחובר למערכת השיתופית</p>
            </div>

            <div class="space-y-2">
                <label class="text-sm font-medium text-slate-300 block">קישור חיצוני למערכת / אתר:</label>
                <div class="flex gap-2">
                    <input type="url" id="external-link" placeholder="הכנס כתובת קישור (https://...)" 
                        class="flex-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <button onclick="openLink()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer">
                        מעבר <i class="fa-solid fa-external-link-alt mr-1"></i>
                    </button>
                </div>
            </div>

            <div class="bg-purple-900/20 border border-purple-500/30 rounded-xl p-4 space-y-3">
                <h3 class="text-sm font-bold text-purple-300 flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-purple-400"></i>
                    עוזר חכם (Gemini AI)
                </h3>
                <div class="flex gap-2">
                    <input type="text" id="ai-prompt-input" placeholder="שאל שאלה את הבינה המלאכותית..." 
                        class="flex-1 px-3 py-2 bg-slate-900 border border-purple-700/50 rounded-lg text-sm text-white focus:outline-none focus:ring-2 focus:ring-purple-500 placeholder-slate-500">
                    <button onclick="askGemini()" id="ai-btn" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1 shadow-lg shadow-purple-600/20 cursor-pointer">
                        <span>שאל</span>
                    </button>
                </div>
                <div id="ai-response-box" class="bg-slate-900/80 border border-purple-500/20 rounded-lg p-3 text-xs text-purple-200 hidden">
                    <span class="font-bold block mb-1 text-purple-300">תשובת Gemini:</span>
                    <p id="ai-response-text" class="whitespace-pre-wrap"></p>
                </div>
            </div>

            <div class="pt-2 border-t border-slate-700 space-y-3">
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300 block">כתיבה בצ'אט השיתופי (איתות / הודעה):</label>
                    <div class="flex gap-2">
                        <input type="text" id="alert-message-input" placeholder="כתוב הודעה שכולם יראו..." 
                            class="flex-1 px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-rose-500 placeholder-slate-500">
                        <button onclick="sendAlertMessage()" class="bg-rose-600 hover:bg-rose-500 px-4 py-2.5 rounded-xl text-sm font-medium transition flex items-center gap-1 shadow-lg shadow-rose-600/30 cursor-pointer">
                            <i class="fa-solid fa-paper-plane"></i>
                            <span>שלח</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-700 rounded-xl p-4 space-y-3">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-bold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-tower-broadcast text-rose-400 animate-pulse"></i>
                        יומן צ'אט ואיתותים בזמן אמת
                    </h3>
                    <span id="sync-status" class="text-xs text-slate-500">ממתין להתחברות...</span>
                </div>
                <div id="alerts-log" class="max-h-56 overflow-y-auto space-y-2 text-xs text-slate-300 pr-1">
                    <p class="text-slate-500 text-center py-2">אין הודעות כרגע.</p>
                </div>
            </div>

            <button onclick="resetAuth()" class="w-full text-slate-400 text-xs hover:text-white py-1 text-center block cursor-pointer">
                התנתק מהמערכת
            </button>
        </div>

    </div>

    <div id="custom-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl">
            <div id="modal-icon" class="text-4xl"></div>
            <h3 id="modal-title" class="text-lg font-bold"></h3>
            <p id="modal-message" class="text-sm text-slate-300"></p>
            <button onclick="closeModal()" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-xl text-sm font-medium transition cursor-pointer">
                אישור
            </button>
        </div>
    </div>

    <script>
        const P1 = "12עוז12";
        const P2 = "12אבישי34";

        function verifyStep1() {
            const pass1 = document.getElementById('pass1').value;
            if (pass1 === P1) {
                document.getElementById('step1-container').classList.add('hidden');
                document.getElementById('step2-container').classList.remove('hidden');
                document.getElementById('pass2').focus();
            } else {
                showModal('שגיאת אבטחה', 'סיסמה ראשונה שגויה, נסה שוב.', 'error');
            }
        }

        function verifyStep2() {
            const pass2 = document.getElementById('pass2').value;
            if (pass2 === P2) {
                document.getElementById('step2-container').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                initFirebaseModule();
            } else {
                showModal('שגיאת אבטחה', 'סיסמה שנייה שגויה, נסה שוב.', 'error');
            }
        }

        function resetAuth() {
            document.getElementById('pass1').value = '';
            document.getElementById('pass2').value = '';
            document.getElementById('main-content').classList.add('hidden');
            document.getElementById('step2-container').classList.add('hidden');
            document.getElementById('step1-container').classList.remove('hidden');
            document.getElementById('pass1').focus();
        }

        function openLink() {
            let url = document.getElementById('external-link').value.trim();
            if (!url) {
                showModal('שגיאה', 'אנא הזן כתובת קישור תקינה.', 'error');
                return;
            }
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            window.open(url, '_blank');
        }

        function showModal(title, message, type) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            document.getElementById('modal-icon').innerHTML = type === 'error' ? 
                '<i class="fa-solid fa-circle-xmark text-rose-500"></i>' : 
                '<i class="fa-solid fa-circle-check text-emerald-500"></i>';
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('pass1').addEventListener('keydown', (e) => { if (e.key === 'Enter') verifyStep1(); });
            document.getElementById('pass2').addEventListener('keydown', (e) => { if (e.key === 'Enter') verifyStep2(); });
            document.getElementById('ai-prompt-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') askGemini(); });
            document.getElementById('alert-message-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendAlertMessage(); });
        });

        let localAlerts = [];
        window.sendAlertMessage = function() {
            if (window.firebaseSendAlert) {
                window.firebaseSendAlert();
            } else {
                const input = document.getElementById('alert-message-input');
                const text = input.value.trim();
                if (!text) return;
                
                const now = new Date();
                const timeString = now.toLocaleTimeString('he-IL');
                localAlerts.unshift({ senderId: 'מקומי', timestamp: timeString, message: text, id: Date.now() });
                input.value = '';
                renderLocalAlerts();
            }
        };

        window.deleteAlert = function(id) {
            if (window.firebaseDeleteAlert) {
                window.firebaseDeleteAlert(id);
            } else {
                localAlerts = localAlerts.filter(a => a.id !== id);
                renderLocalAlerts();
            }
        };

        function renderLocalAlerts() {
            const log = document.getElementById('alerts-log');
            if (localAlerts.length === 0) {
                log.innerHTML = '<p class="text-slate-500 text-center py-2">אין הודעות כרגע.</p>';
                return;
            }
            log.innerHTML = localAlerts.map(alert => `
                <div class="bg-slate-800 border border-slate-700 rounded-lg p-3 flex flex-col gap-1">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-rose-400 text-xs"><i class="fa-solid fa-user-circle ml-1"></i> משתמש: ${alert.senderId}</span>
                        <div class="flex items-center gap-2">
                            <span class="text-slate-500 text-[10px]">${alert.timestamp}</span>
                            <button onclick="deleteAlert(${alert.id})" class="text-rose-400 hover:text-rose-300 p-1"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                    <p class="text-slate-200 text-xs bg-slate-900/60 p-2 rounded border border-slate-700/50 break-words">${alert.message}</p>
                </div>
            `).join('');
        }

        // Gemini AI Call
        async function askGemini() {
            const promptInput = document.getElementById('ai-prompt-input');
            const promptText = promptInput.value.trim();
            if (!promptText) return;

            const aiBtn = document.getElementById('ai-btn');
            const responseBox = document.getElementById('ai-response-box');
            const responseText = document.getElementById('ai-response-text');

            aiBtn.disabled = true;
            responseBox.classList.remove('hidden');
            responseText.textContent = 'מעבד שאלה...';

            try {
                // המפתח שהתקבל בצילום המסך
                const apiKey = "AIzaSyD-EXAMPLE-KEY-1234567890abcdefGH";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                const payload = {
                    contents: [{ parts: [{ text: promptText }] }],
                    systemInstruction: { parts: [{ text: "ענה בעברית בצורה ברורה, תמציתית ואדיבה." }] }
                };

                const response = await fetch(apiUrl, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(payload) 
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error?.message || `שגיאת שרת (${response.status})`);
                }

                const data = await response.json();
                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (reply) {
                    responseText.textContent = reply;
                } else {
                    responseText.textContent = 'התקבלה תשובה ריקה מהשרת.';
                }
            } catch (err) {
                console.error("Gemini Error:", err);
                responseText.textContent = 'שגיאה בפנייה ל-AI: ' + (err.message || 'לא ניתן להתחבר לשרת.');
            } finally {
                aiBtn.disabled = false;
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.initFirebaseModule = async function() {
            try {
                if (typeof __firebase_config === 'undefined') {
                    document.getElementById('sync-status').textContent = 'מצב מקומי (ללא ענן)';
                    return;
                }

                const appId = typeof __app_id !== 'undefined' ? __app_id : 'shared-security-app';
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                const auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                const currentUser = auth.currentUser;
                document.getElementById('user-info-display').textContent = `מזהה משתמש: ${currentUser ? currentUser.uid.substring(0, 8) + '...' : 'אורח'}`;
                
                const alertsRef = collection(db, 'artifacts', appId, 'public', 'data', 'emergency_signals');
                
                window.firebaseSendAlert = async function() {
                    const messageInput = document.getElementById('alert-message-input');
                    const messageText = messageInput.value.trim();
                    if (!messageText) return;

                    const now = new Date();
                    await addDoc(alertsRef, {
                        senderId: currentUser.uid.substring(0, 6),
                        timestamp: now.toLocaleTimeString('he-IL') + ' ' + now.toLocaleDateString('he-IL'),
                        rawTime: Date.now(),
                        message: messageText
                    });
                    messageInput.value = '';
                };

                window.firebaseDeleteAlert = async function(alertId) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'emergency_signals', alertId));
                };

                onSnapshot(query(alertsRef), (snapshot) => {
                    document.getElementById('sync-status').textContent = 'מסונכרן בענן בזמן אמת';
                    document.getElementById('sync-status').className = 'text-xs text-emerald-400';

                    let docsList = [];
                    snapshot.forEach(docSnap => docsList.push({ id: docSnap.id, ...docSnap.data() }));
                    docsList.sort((a, b) => (b.rawTime || 0) - (a.rawTime || 0));

                    const log = document.getElementById('alerts-log');
                    if (docsList.length === 0) {
                        log.innerHTML = '<p class="text-slate-500 text-center py-2">אין הודעות כרגע.</p>';
                        return;
                    }

                    log.innerHTML = docsList.map(alert => `
                        <div class="bg-slate-800 border border-slate-700 rounded-lg p-3 flex flex-col gap-1">
                            <div class="flex items-center justify-between">
                                <span class="font-bold text-rose-400 text-xs"><i class="fa-solid fa-user-circle ml-1"></i> משתמש: ${alert.senderId || 'לא ידוע'}</span>
                                <div class="flex items-center gap-2">
                                    <span class="text-slate-500 text-[10px]">${alert.timestamp || ''}</span>
                                    <button onclick="deleteAlert('${alert.id}')" class="text-rose-400 hover:text-rose-300 p-1"><i class="fa-solid fa-trash-can"></i></button>
                                </div>
                            </div>
                            <p class="text-slate-200 text-xs bg-slate-900/60 p-2 rounded border border-slate-700/50 break-words">${alert.message || ''}</p>
                        </div>
                    `).join('');
                });

            } catch (e) {
                console.error("Firebase init failed:", e);
                document.getElementById('sync-status').textContent = 'מצב מקומי';
            }
        };
    </script>
</body>
</html>
